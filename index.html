<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>VYBX — Coming Soon</title>
<meta name="description" content="VYBX is a networking and engagement platform by CORE AI, built to make connections more intentional and participation easier to understand. Coming soon." />
<link rel="canonical" href="https://www.getvybx.com/" />
<meta property="og:site_name" content="VYBX" />
<meta property="og:title" content="VYBX — Coming Soon" />
<meta property="og:description" content="A networking and engagement platform by CORE AI, built to make connections more intentional and participation easier to understand." />
<meta property="og:url" content="https://www.getvybx.com/" />
<meta property="og:type" content="website" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    color: #ffffff;
    min-height: 100%;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* To add a real photo later: replace the gradient above with
     background-image: url('data:image/jpeg;base64,...');
     using a base64-encoded version of the photo (external image
     links get blocked, so it has to be embedded directly). */
  .hero-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 15% 20%, rgba(168,85,247,0.55) 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(99,102,241,0.5) 0%, transparent 50%),
      radial-gradient(circle at 75% 80%, rgba(236,72,153,0.45) 0%, transparent 50%),
      radial-gradient(circle at 20% 85%, rgba(139,92,246,0.4) 0%, transparent 45%),
      #0A0814;
    z-index: 0;
  }
  .hero-bg::after {
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 28px 28px;
  }
  .hero-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(100deg, rgba(6,4,12,0.55) 0%, rgba(6,4,12,0.15) 50%, rgba(6,4,12,0.4) 100%);
    z-index: 1;
  }

  nav {
    position: relative; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 28px 56px;
  }
  .nav-logo img { height: 34px; display: block; }
  .nav-tag {
    font-size: 12px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
    color: #C7C9D6; border: 1px solid rgba(255,255,255,0.18); border-radius: 999px;
    padding: 7px 16px;
  }

  .hero-content {
    position: relative; z-index: 2;
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
    padding: 20px 56px 80px;
    max-width: 780px;
  }

  .eyebrow {
    font-size: 12.5px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    background: linear-gradient(90deg, #A855F7, #6366F1, #EC4899);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 22px;
  }

  h1 {
    font-size: clamp(38px, 6vw, 68px);
    font-weight: 800;
    letter-spacing: -1.5px;
    line-height: 1.08;
    margin-bottom: 26px;
  }

  p.lede {
    font-size: 18px;
    color: #D5D7E3;
    line-height: 1.7;
    max-width: 560px;
    margin-bottom: 40px;
  }

  .cta-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 40px; }

  .cta-primary {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 16px 32px;
    border-radius: 8px;
    background: linear-gradient(90deg, #A855F7, #EC4899);
    color: #ffffff;
    text-decoration: none;
    font-size: 15px; font-weight: 700; letter-spacing: 0.2px;
    box-shadow: 0 8px 24px rgba(168,85,247,0.35);
    transition: transform .15s, box-shadow .15s;
  }
  .cta-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(168,85,247,0.45); }

  .status-pill {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; letter-spacing: 0.3px;
    color: #D5D7E3;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px;
    padding: 12px 22px;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #EC4899; box-shadow: 0 0 0 4px rgba(236,72,153,0.2); }

  .built-by { font-size: 13.5px; color: #9295A6; }
  .built-by a { color: #C7C9D6; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.25); }
  .built-by a:hover { color: #ffffff; }

  @media (max-width: 640px) {
    nav { padding: 22px 20px; }
    .hero-content { padding: 20px 20px 60px; }
    p.lede { font-size: 16px; }
    .cta-row { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>

  <nav>
    <div class="nav-logo"><img src="vybx-logo.png" alt="VYBX" /></div>
    <div class="nav-tag">Coming Soon</div>
  </nav>

  <div class="hero-content">
    <div class="eyebrow">A Product by CORE AI</div>
    <h1>Right place.<br>Right people.<br>Right time.</h1>
    <p class="lede">VYBX is being built to make networking and engagement more intentional &mdash; and to give organizations a clearer view of who's actually participating and staying involved.</p>

    <div class="cta-row">
      <a href="mailto:abdul@gocoreai.co?subject=VYBX%20Early%20Interest" class="cta-primary">Get in Touch &rarr;</a>
      <div class="status-pill"><span class="status-dot"></span> In development</div>
    </div>

    <div class="built-by">Built by <a href="https://www.gocoreai.co" target="_blank" rel="noopener">CORE AI</a></div>
  </div>
</div>

</body>
</html>
